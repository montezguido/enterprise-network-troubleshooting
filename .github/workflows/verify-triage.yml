name: Verify independent network triage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
    matrix:
      include:
        - os: ubuntu-latest
          python: '3.11'
        - os: ubuntu-latest
          python: '3.14'
        - os: windows-latest
          python: '3.14'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python source
        run: python -m compileall -q portfolio_demo tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic triage
        run: python portfolio_demo/triage.py
      - name: Validate structured output
        run: python portfolio_demo/triage.py --json
